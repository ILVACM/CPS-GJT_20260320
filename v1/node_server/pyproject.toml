[project]
name = "node-server"
version = "0.1.0"
description = "钢筋直径测量设备 - 服务节点（系统主控）"
requires-python = ">=3.9"
dependencies = [
    "opencv-python>=4.5.0",
    "pyserial>=3.5",
    "Pillow>=8.0.0",
    "grpcio>=1.50.0",
    "grpcio-tools>=1.50.0",
    "protobuf>=4.21.0",
    # K3：pyorbbecsdk v2.1.1 与 numpy 2.x 不兼容，须锁定 <2.0
    # 注：pyorbbecsdk 走本地 wheel 安装（仅 Linux ARM64），不入 dependencies
    "numpy>=1.21.0,<2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["utils"]
